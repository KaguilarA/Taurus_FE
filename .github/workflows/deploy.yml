name: Frontend CI and deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test -- --watch=false
      - run: node --test scripts/deployment.test.mjs
      - if: github.event_name == 'pull_request'
        run: npm run build

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL }}
      DEPLOYMENT_METADATA_PATH: /deployment.json
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check deployment configuration
        run: test -n "$DEPLOYMENT_URL"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Publish validated production branch
        env:
          ARTIFACT_DIR: dist/taurus-ng-fe/browser
        run: node scripts/publish-production.mjs
      - name: Verify deployed revision and backend readiness
        run: node scripts/wait-deployment.mjs
