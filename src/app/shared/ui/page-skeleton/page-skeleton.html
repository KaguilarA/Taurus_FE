<div
	role="status"
	aria-busy="true"
	aria-label="Cargando contenido"
	[class]="variant() === 'section' ? 'w-full' : 'min-h-dvh bg-canvas'"
>
	<div
		class="mx-auto grid gap-6"
		[class]="variant() === 'section' ? 'w-full' : 'w-[88%] max-w-7xl py-7'"
		aria-hidden="true"
	>
		@if (variant() !== 'section') {
			<div class="flex items-center justify-between py-4">
				<span
					class="h-10 w-44 animate-pulse rounded-lg bg-surface-raised motion-reduce:animate-none"
				></span>
				<span
					class="h-5 w-1/3 animate-pulse rounded-lg bg-surface-raised motion-reduce:animate-none"
				></span>
			</div>
		}
		<div
			class="grid gap-5 rounded-xl border border-border p-6"
			[class.min-h-80]="variant() === 'landing'"
		>
			<span
				class="h-3 w-24 animate-pulse rounded bg-surface-raised motion-reduce:animate-none"
			></span>
			<span
				class="h-12 w-3/4 animate-pulse rounded bg-surface-raised motion-reduce:animate-none"
			></span>
			<span
				class="h-4 w-1/2 animate-pulse rounded bg-surface-raised motion-reduce:animate-none"
			></span>
		</div>
		<div class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3">
			@for (card of cards(); track card) {
				<div class="grid min-h-40 content-start gap-5 rounded-xl border border-border p-6">
					<span
						class="h-3 w-1/3 animate-pulse rounded bg-surface-raised motion-reduce:animate-none"
					></span>
					<span
						class="h-4 w-full animate-pulse rounded bg-surface-raised motion-reduce:animate-none"
					></span>
					<span
						class="h-4 w-2/3 animate-pulse rounded bg-surface-raised motion-reduce:animate-none"
					></span>
				</div>
			}
		</div>
	</div>
</div>
