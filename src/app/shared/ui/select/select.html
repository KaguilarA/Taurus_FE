<button
	type="button"
	ngCombobox
	#combobox="ngCombobox"
	[(expanded)]="expanded"
	[disabled]="disabled()"
	[attr.aria-label]="label()"
	class="flex min-h-11 w-full items-center justify-between gap-3 rounded-lg border border-border bg-surface px-3 py-2 text-left text-xs text-warm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:opacity-50"
>
	{{ selectedLabel() }} <span aria-hidden="true">▾</span>
</button>
<ng-template ngComboboxPopup [combobox]="combobox">
	<div
		ngComboboxWidget
		ngListbox
		#listbox="ngListbox"
		[activeDescendant]="listbox.activeDescendant()"
		[value]="[value()]"
		(valueChange)="select($event)"
		[attr.aria-label]="label()"
		focusMode="activedescendant"
		selectionMode="explicit"
		class="absolute inset-x-0 top-full z-30 mt-1 max-h-60 overflow-auto rounded-lg border border-border bg-surface p-1 shadow-xl"
	>
		@for (option of options(); track option.value) {
			<div
				ngOption
				(click)="expanded.set(false)"
				[value]="option.value"
				[label]="option.label"
				class="cursor-pointer rounded-md px-3 py-2 text-xs text-warm hover:bg-surface-raised aria-selected:bg-accent-soft aria-selected:text-accent data-[active=true]:outline-2 data-[active=true]:outline-accent"
			>
				{{ option.label }}
			</div>
		}
	</div>
</ng-template>
