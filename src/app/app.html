@if (api.connecting()) {
	<p
		class="fixed inset-x-4 top-4 z-50 mx-auto max-w-xl rounded-lg border border-border bg-surface-raised px-5 py-3 text-sm text-foreground"
		role="status"
	>
		Estamos conectando con el servidor. El primer acceso puede tardar cerca de un minuto.
	</p>
}
@if (navigating() && initial()) {
	<app-page-skeleton
		[variant]="
			destination().startsWith('/admin')
				? 'admin'
				: destination().startsWith('/cuenta')
					? 'account'
					: 'landing'
		"
	/>
}
@if (navigating() && !initial()) {
	<div
		class="fixed inset-x-0 top-0 z-50 h-1 animate-pulse bg-accent motion-reduce:animate-none"
		role="status"
	>
		<span class="sr-only">Abriendo página</span>
	</div>
}
<app-feedback [error]="navigationError()" />
<div [hidden]="navigating() && initial()"><router-outlet /></div>
