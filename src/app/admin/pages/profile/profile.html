<app-admin-page-heading title="Mi perfil" description="Actualizá tus datos y tu contraseña." />
<app-feedback [error]="error()" [notice]="notice()" />
@if (loading()) {
	<app-page-skeleton variant="section" />
} @else {
	@if (api.state(); as state) {
		@if (profile(); as draft) {
			<div class="grid lg:grid-cols-2 gap-6">
				<form
					class="panel overflow-hidden rounded-xl border border-border bg-surface p-6 form-grid grid gap-5"
					(ngSubmit)="saveProfile()"
				>
					<h2>Mi perfil</h2>
					<label
						>Nombre<input
							name="ownName"
							[ngModel]="draft.name"
							(ngModelChange)="updateField(profile, ['name'], $event)"
							required
							maxlength="100"
							autocomplete="name"
					/></label>
					<label
						>Usuario<input
							name="ownUsername"
							[ngModel]="draft.username"
							(ngModelChange)="updateField(profile, ['username'], $event)"
							required
							minlength="3"
							maxlength="40"
							autocomplete="username"
					/></label>
					<button appButton="primary" [disabled]="busy()">Guardar perfil</button>
				</form>
				<form
					class="panel overflow-hidden rounded-xl border border-border bg-surface p-6 form-grid grid gap-5"
					(ngSubmit)="changeOwnPassword()"
				>
					<h2>Cambiar mi contraseña</h2>
					<label
						>Contraseña actual<input
							type="password"
							name="currentPassword"
							[ngModel]="ownPassword().currentPassword"
							(ngModelChange)="updateField(ownPassword, ['currentPassword'], $event)"
							autocomplete="current-password"
							required
					/></label>
					<label
						>Nueva contraseña<input
							type="password"
							name="ownNewPassword"
							[ngModel]="ownPassword().password"
							(ngModelChange)="updateField(ownPassword, ['password'], $event)"
							autocomplete="new-password"
							minlength="12"
							required
					/></label>
					<label
						>Confirmar contraseña<input
							type="password"
							name="ownConfirmPassword"
							[ngModel]="ownPassword().passwordConfirmation"
							(ngModelChange)="
								updateField(ownPassword, ['passwordConfirmation'], $event)
							"
							autocomplete="new-password"
							minlength="12"
							required
					/></label>
					<button appButton="primary" [disabled]="busy()">Cambiar contraseña</button>
				</form>
			</div>
		}
	}
}
